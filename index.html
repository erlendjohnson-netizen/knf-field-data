<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KNF Field Data</title>
<meta name="theme-color" content="#CE181E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KNF Data">
<style>
:root{--bg:#f7f4f2;--card:#ffffff;--ink:#0A0203;--mut:#5d5555;--line:#e2d9d6;--acc:#CE181E;--acc2:#610B0E;--ok:#2e7d4f;--warn:#b26a00;--bad:#b3261e;--chip:#ebe6da;--inp:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151112;--card:#201a1b;--ink:#f1eaea;--mut:#b3a7a7;--line:#3a3031;--acc:#ff5a5f;--acc2:#e9a3a5;--ok:#6fcf97;--warn:#f2b34b;--bad:#ff8a80;--chip:#2a2f29;--inp:#111411}}
:root[data-theme=dark]{--bg:#151112;--card:#201a1b;--ink:#f1eaea;--mut:#b3a7a7;--line:#3a3031;--acc:#ff5a5f;--acc2:#e9a3a5;--ok:#6fcf97;--warn:#f2b34b;--bad:#ff8a80;--chip:#2a2f29;--inp:#111411}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{cursor:pointer;position:sticky;top:0;z-index:5;background:#CE181E;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}

header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap;cursor:pointer;border:0;color:inherit}
.pill.warn{background:var(--warn);color:#fff}.pill.ok{background:rgba(255,255,255,.18)}
main{max-width:1100px;margin:0 auto;padding:12px 16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:10px 0 12px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600}
nav.tabs a.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
nav.tabs svg{display:block;margin:0 auto 2px;width:22px;height:22px}
@media (min-width:900px){body{padding-bottom:0}nav.tabs{position:sticky;top:44px;border-top:0;border-bottom:1px solid var(--line);justify-content:center}nav.tabs a{flex:0 0 140px;display:flex;gap:6px;align-items:center;justify-content:center}nav.tabs svg{margin:0;width:18px;height:18px}}
.crumbs{font-size:14px;color:var(--mut);margin:4px 0 10px;display:flex;flex-wrap:wrap;gap:4px}
.crumbs a{color:var(--acc);text-decoration:none}
h2{font-size:20px;margin:6px 0 10px}h3{font-size:15px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
h3 .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit;min-height:48px;cursor:pointer}
.row:hover{border-color:var(--acc)}
.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t small{color:var(--mut)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mut);white-space:nowrap}
.badge.pos{background:var(--acc2);color:#fff}.badge.gps{background:var(--ok);color:#fff}.badge.nogps{background:var(--warn);color:#fff}
.btn{appearance:none;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn:not(.sec):not(.bad):not(.warnbtn){color:#1a0d0e}}
.btn.sec{background:transparent;color:var(--acc)}.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}.f.w2{grid-column:span 2}.f.w3{grid-column:1/-1}
@media (max-width:360px){.f.w2{grid-column:1/-1}}
.f label{font-size:13px;color:var(--mut);font-weight:600}.f label .req{color:var(--bad)}
.f .help{font-size:12px;color:var(--mut)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.f.err input,.f.err select{border-color:var(--bad)}.f .msg{font-size:12px;color:var(--bad)}.f .msg.w{color:var(--warn)}
.ro{padding:10px;border-radius:8px;background:var(--chip);min-height:44px;font-variant-numeric:tabular-nums}
.tog{flex-direction:row;align-items:center;gap:8px;min-height:44px;padding-top:16px}.tog input{width:24px;height:24px;min-height:0;accent-color:var(--acc)}
.tog label{font-size:15px;color:var(--ink);font-weight:500}
.grp{grid-column:1/-1;font-weight:700;font-size:13px;color:var(--acc2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);padding-top:8px}
.gps{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:10px}
.gps .live{font-size:14px;color:var(--mut);margin:6px 0}
.formbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
@media (min-width:900px){.formbar{bottom:0}}
.empty{color:var(--mut);font-size:14px;padding:8px 2px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 14px;font-size:14px}.kv span{color:var(--mut)}
.search{margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;font-size:14px;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:440px;width:100%}
.check{font-size:13px;border-left:3px solid var(--warn);padding:6px 10px;background:var(--card);border-radius:6px;margin:6px 0}
.check.okc{border-color:var(--ok)}
.check.bagnext{border-color:var(--teal,#0097A7);background:rgba(0,151,167,.08)}
.bagprompt b.t{font-size:18px;display:block;color:#CE181E}
.baglevel{border:2px dashed #CE181E;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:15px}
.baglevel small{display:block;color:var(--mut,#666);font-size:12px}
.bagrow{display:flex;gap:8px;align-items:center;margin:6px 0}.bagrow b{white-space:nowrap;color:var(--ok)}.bagrow select{flex:1;min-height:36px}
.btn.big{width:100%;min-height:56px;font-size:18px}
table.cat{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}table.cat th,table.cat td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.hidden{display:none!important}
header .hbtn{color:inherit;display:flex;padding:4px}
header{gap:8px}
.home{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 14px}
@media (max-width:520px){.home{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;border-radius:18px;text-decoration:none;color:#fff;font-size:28px;font-weight:800;letter-spacing:.02em;padding:18px;text-align:center}
.tile span{display:flex;flex-direction:column;align-items:center;gap:4px}.tile svg{width:76px;height:76px}.tile small{font-size:14px;font-weight:500;opacity:.9;letter-spacing:0}
.tile.field{background:#CE181E}.tile.lab{background:#610B0E}
.tile.bagchk{background:#0A0203;grid-column:1/-1;order:3;min-height:110px;flex-direction:row;font-size:24px}.tile.bagchk svg{width:56px;height:56px}.tile.bagchk span{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.dcstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.dcstats div{background:var(--card);border-radius:10px;padding:8px;text-align:center;font-size:13px;border:1px solid var(--line,#ddd)}.dcstats b{display:block;font-size:26px}.dcstats .ok b{color:var(--ok)}.dcstats .bad{border:2px solid var(--bad)}.dcstats .bad b{color:var(--bad)}.dcstats .warn b{color:#b8860b}
.tgt{border-collapse:collapse;margin:6px 0;font-variant-numeric:tabular-nums}.tgt td,.tgt th{padding:4px 10px;border-bottom:1px solid var(--line);text-align:left}
.mun{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}.mun select{width:auto;min-width:0;flex:1}.mun select[data-p=hue]{flex:1.4}.mun input{flex:2}.f.locked select,.f.locked input{opacity:.6}
table.corners{border-collapse:collapse;width:100%}table.corners th{font-size:12px;font-weight:600;padding:2px 3px;text-align:center}table.corners td{padding:2px}table.corners input{width:100%;min-width:0;padding:6px 4px;text-align:center}
.mapbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.mapbar select{width:auto;flex:1;min-width:140px;min-height:34px}.sitemap.withimg .m-lab{fill:#fff;paint-order:stroke;stroke:#000;stroke-width:.4%}.imgcell{image-rendering:auto}
.dcgroup ul{margin:4px 0 0;padding-left:18px}ul.card.dcgroup{padding-left:30px}.dcgroup li{margin:3px 0}.dcsite{display:flex;gap:8px;align-items:center;padding:8px 0;font-size:16px}.dcsite input{width:22px;height:22px;min-height:0}
@media print{.noprint,#tabs,header,.formbar,#draftbar,#testbar{display:none!important}}
@media (max-width:520px){.tile{min-height:150px;flex-direction:row;justify-content:flex-start;font-size:26px}.tile svg{width:60px;height:60px}.tile span{display:flex;flex-direction:column;align-items:flex-start;gap:2px}}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mini{display:flex;align-items:center;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600}
.legal{margin:28px 0 8px;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--mut)}
.qrrow{display:flex;gap:8px}.qrrow input{flex:1;font-family:ui-monospace,Consolas,monospace;letter-spacing:.05em}
.scanbox{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-height:60vh}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .aim{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.bigscan{font-size:20px;min-height:72px;width:100%}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:.06em}
.hist{font-size:14px}.hist div{padding:6px 0;border-bottom:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.dim{opacity:.55}
.need{border-left:4px solid #ffcc00;padding-left:6px;border-radius:4px}.need .msg.n{color:#8a6d00;font-weight:600}
.flash{animation:flash 1.2s ease 2}@keyframes flash{50%{background:#fff3b0}}
.misslist li{margin:3px 0}.misslist a{color:var(--ink);text-decoration:underline}
/* printable label sheets */
.boxlbl{position:absolute;left:.25in;top:.25in;width:6in;height:4in;border:1px dashed #999;padding:.2in;box-sizing:border-box;font-family:Arial,sans-serif;color:#000;overflow:hidden}
.sheet{background:#fff;color:#000;width:8.5in;height:11in;position:relative;margin:0 auto 16px;box-shadow:0 1px 6px rgba(0,0,0,.2);overflow:hidden}
.lbl{position:absolute;display:flex;align-items:center;gap:.06in;padding:.05in .08in;overflow:hidden;font-family:Arial,sans-serif}
.lbl svg{flex:none}.lbl .lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lbl .lc{font:700 13pt/1 ui-monospace,Consolas,monospace;letter-spacing:.04em}.lbl .ls{font-size:6.5pt;line-height:1.35;color:#222}
.sheetwrap{overflow-x:auto}
@media print{header,nav,.noprint,.toast{display:none!important}body{background:#fff;padding:0}main{padding:0;max-width:none}.sheet{box-shadow:none;margin:0;page-break-after:always}.sheetwrap{overflow:visible}@page{size:letter;margin:0}}
.testbar{display:block;background:repeating-linear-gradient(45deg,#5b2a86 0 14px,#6d35a0 14px 28px);color:#fff;padding:8px 16px;font-weight:800;text-align:center;font-size:14px;text-decoration:none;letter-spacing:.02em}
.draftbar{display:block;background:repeating-linear-gradient(-45deg,#ffcc00 0 14px,#ffd84d 14px 28px);color:#0A0203;padding:10px 16px;font-weight:700;text-decoration:none;text-align:center;font-size:15px;position:sticky;top:44px;z-index:4}
.draftbar small{display:block;font-weight:500;opacity:.95}
@media (min-width:900px){.draftbar{top:92px}}
.row.unfin{border:2px solid #e0a800;background:repeating-linear-gradient(-45deg,rgba(255,204,0,.18) 0 10px,transparent 10px 20px)}
.unfinlabel{background:#ffcc00;color:#0A0203;border:1px solid #0A0203;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.04em;white-space:nowrap}
.unfinbox{border:3px solid #e0a800;border-radius:12px;padding:12px;margin:10px 0;background:var(--card)}
.unfinbox b.t{color:var(--ink);font-size:17px;display:block;margin-bottom:4px}
.btn.warnbtn{background:#ffcc00;color:#0A0203;border-color:#0A0203}
.plan{width:100%;max-height:340px;display:block;background:var(--inp);border-radius:8px;touch-action:manipulation}
.plan .g1{stroke:var(--line);stroke-width:.02}.plan .g2{stroke:var(--line);stroke-width:.008;stroke-dasharray:.04 .04}
.plan .su{fill:rgba(206,24,30,.12);stroke:var(--acc);stroke-width:.03;cursor:pointer}.plan .su.sel{fill:rgba(0,151,167,.35);stroke:#0097A7}
.plan .su.done{fill:rgba(206,24,30,.32)}.plan .su.edit{fill:rgba(163,84,43,.45);stroke:var(--acc2);stroke-width:.04;stroke-dasharray:.08 .05;cursor:grab;touch-action:none}.plan .su.edit.act{fill:rgba(163,84,43,.7)}.plan.dragging .su.edit.act{cursor:grabbing;stroke-width:.07}
.plan .su.win{fill:rgba(110,70,170,.3);stroke:#5b3a9a;stroke-width:.035;stroke-dasharray:.07 .04}.plan .su.win.done{fill:rgba(110,70,170,.5)}.plan .su.win.sel{fill:rgba(0,151,167,.45);stroke:#0097A7}.plan .sut.win{font-size:.2px}
.plan .sut{font:700 .32px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.plan .datum circle{fill:#b3261e}.plan .datum path{stroke:#b3261e;stroke-width:.03}
.plan .shot{fill:var(--ok)}.plan .shot.bad{fill:var(--bad)}.plan .narrow{fill:var(--ink)}.plan .nt{font:700 .18px system-ui;fill:var(--ink);text-anchor:middle}
.piece.act{border:2px solid var(--acc2)}
.gpslive{margin:8px 0 2px;padding:8px 10px;border-radius:8px;font-size:15px;border:2px solid var(--line);background:var(--card)}
.gpslive .lv-tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--chip)}
.gpslive.good{border-color:#2e7d4f}.gpslive.good .lv-tag{background:#2e7d4f;color:#fff}
.gpslive.fair{border-color:#e0a800}.gpslive.fair .lv-tag{background:#ffcc00;color:#0A0203}
.gpslive.poor,.gpslive.stale{border-color:#b3261e}.gpslive.poor .lv-tag,.gpslive.stale .lv-tag{background:#b3261e;color:#fff}
.sitemap{width:100%;max-height:420px;background:var(--inp);border-radius:8px;display:block}
.sitemap .m-plan{fill:none;stroke:#33507a;stroke-width:.35%}.plancard{border:2px dashed #33507a;margin:8px 0}.plancard b.t{display:block;font-size:17px;margin-bottom:4px}.badge.planned{background:#e8eef7;color:#33507a}details.tr{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:6px 0;padding:6px 10px}details.tr summary{cursor:pointer;padding:6px 0}
.sitemap .m-stp{fill:var(--card);stroke:var(--ink);stroke-width:.25%}.sitemap .m-stp.pos{fill:#CE181E;stroke:#610B0E}
.sitemap .m-unit{fill:#0097A7;stroke:#0A0203;stroke-width:.2%}.sitemap .m-pt{fill:#ffcc00;stroke:#0A0203;stroke-width:.2%}
.sitemap .m-bnd{fill:#610B0E}.sitemap .m-bndline{fill:rgba(206,24,30,.06);stroke:#610B0E;stroke-dasharray:1% .6%;stroke-width:.3%}
.sitemap .m-reg circle{fill:none;stroke:#367075;stroke-width:.3%}.sitemap .m-reg path{stroke:#367075;stroke-width:.3%}
.sitemap .m-lab{fill:var(--ink);font-family:system-ui,sans-serif}.sitemap .m-bar{stroke:var(--ink);stroke-width:.6%}.sitemap .m-n{fill:var(--ink)}
.sitemap [data-go]{cursor:pointer}
.photos{grid-column:1/-1;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.card>.photos{border:0;margin:0;padding:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{width:96px;border:1px solid var(--line);border-radius:8px;background:var(--chip);padding:0;overflow:hidden;cursor:pointer;color:var(--ink);font:inherit}
.thumb img{width:96px;height:72px;object-fit:cover;display:block}.thumb small{display:block;font-size:11px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .help{display:flex;height:72px;align-items:center;justify-content:center;font-size:11px}
</style>
</head>

/* ================= computed fields ================= */
function euIndex(eu) {
  eu = String(eu || 'A').trim().toUpperCase();
  if (/^[A-Z]$/.test(eu)) return eu.charCodeAt(0) - 64;
  if (/^[A-Z]{2}$/.test(eu)) return (eu.charCodeAt(0) - 64) * 26 + eu.charCodeAt(1) - 64;
  if (/^\d{1,2}$/.test(eu)) return +eu;

}
function compute(tbl, d, ctx) {

    if (exc && isUnit(exc.data)) { const su = subsOf(exc.id).find(s => String(s.data.letter).toUpperCase() === String(d.excavation_unit || '').toUpperCase()); if (su) area = partsArea(partsOf(su)); }
    else if (exc && num(exc.data.lengthcm) && num(exc.data.widthcm)) area = exc.data.lengthcm * exc.data.widthcm / 10000;

  if (tbl === 'excavations' && ctx.self && isUnit(d)) d.number_of_eu = subsOf(ctx.self.id).length;

    const cnt = ['primaryflakect', 'secondaryflakect', 'tertiaryflakect', 'shatter', 'utlzdflkct', 'corecnt', 'tstcobblect', 'diagnosticlithicsct', 'fcrcount', 'grndstnct',

    const wt = ['primaryfakewghtg', 'secondaryflakwght', 'tertiaryflakwght', 'shatterwght', 'utlzdflkwgt', 'corwght', 'tstcobblewght', 'diagnosticlithicswght', 'fcrwght',
      'grndstnwght', 'plainsherdwght', 'plnsherdrimwght', 'decsherdwght', 'decsherdrimwght', 'diagnosticceramwght', 'historicwght'].reduce((a, k) => a + c(k), 0);

    d.hist_wght = +fs.filter(f => f.t === 'num').reduce((a, f) => a + (num(d[f.k]) || 0), 0).toFixed(2);

}

/* ================= persistence ================= */
async function save(rec) {
  rec.updated_at = now(); rec.updated_by = me(); rec.dirty = 1;
  if (!rec.created_at) { rec.created_at = rec.updated_at; rec.created_by = me(); rec.created_uid = S.session?.uid || null; }
  S.recs.set(rec.id, rec);
  await CORE.putRec(rec);
  updatePill(); queueSync();
}
/* who may delete: staff roles may delete anything; everyone else only records they made themselves
   (the server enforces the same rule; see is_staff() in supabase_setup.sql) */
const STAFF_ROLES = ['PI / Co-PI', 'Project staff', 'Field director / crew chief', 'USFS staff'];
const isStaff = () => STAFF_ROLES.includes(S.settings.role);
const isAdmin = () => S.settings.role === 'PI / Co-PI';
const mine = r => r.created_uid ? r.created_uid === S.session?.uid : (r.dirty && r.created_by === me());
function subtree(rec) { const all = [rec]; const walk = id => [...S.recs.values()].filter(r => r.parent === id && !r.deleted).forEach(c => { all.push(c); walk(c.id); }); walk(rec.id); return all; }
const canDelete = rec => isStaff() || subtree(rec).every(mine);
const noDeleteMsg = 'Only project staff and USFS staff can delete records made by someone else. Ask the field director.';
async function softDelete(rec) {
  const all = [rec]; const walk = id => [...S.recs.values()].filter(r => r.parent === id && !r.deleted).forEach(c => { all.push(c); walk(c.id); });
  walk(rec.id);
  for (const r of all) { r.deleted = 1; await save(r); }
  return all.length;
}
async function siteUUID(name) { // same site number -> same id on every device, so sites never duplicate
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('knf-site:' + name.trim().toUpperCase())));
  const x = [...h.slice(0, 16)].map(b => b.toString(16).padStart(2, '0')).join('');
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-5${x.slice(13, 16)}-a${x.slice(17, 20)}-${x.slice(20, 32)}`;
}
function mk(tbl, parent, data = {}) {
  const p = parent ? get(parent) : null;
  const id = uuid();
  return { id, tbl, parent: parent || null, site: tbl === 'sites' ? id : (p ? (p.tbl === 'sites' ? p.id : p.site) : null), data, deleted: 0 };
}

/* ---- a quarter-unit window: a smaller square dug inside a subunit, below its floor, to reach sterile ---- */
function viewWindow(id, of) {
  const e = get(id); if (!e || !isUnit(e.data)) return notFound();
  const par = subsOf(id).find(s => String(s.data.letter).toUpperCase() === of); if (!par) return notFound();
  const lv = suLevels(id, of).sort((a, b) => num(a.data.levelno) - num(b.data.levelno)), last = lv[lv.length - 1];
  if (!last) { toast(`Subunit ${of} has no levels yet`); location.hash = '#/rec/' + id; return; }
  const big = partsOf(par).slice().sort((a, b) => b.w * b.h - a.w * a.h)[0], w = r2(big.w / 2), h = r2(big.h / 2);
  const Q = { SW: { x: big.x, y: big.y }, SE: { x: r2(big.x + w), y: big.y }, NW: { x: big.x, y: r2(big.y + h) }, NE: { x: r2(big.x + w), y: r2(big.y + h) } };
  S.winQ = Q[S.winQ] ? S.winQ : 'SW';
  const part = { ...Q[S.winQ], w, h }, L = nextLetter(id), closedPar = lv.some(l => l.data.terminal_level);
  setTitle('¼-unit window in ' + of);
  $('#app').innerHTML = `${crumbs(e)}<h2>Dig a ¼-unit window in ${esc(of)}</h2>
    <div class="help">A smaller square inside subunit ${esc(of)}, dug below its floor to reach two sterile levels. It gets its own letter (<b>${esc(L)}</b>) and carries on ${esc(of)}’s level numbers: its first level is <b>level ${(num(last.data.levelno) || 0) + 1}</b>, starting at <b>${esc(last.data.bgscm)} cmbs</b>.</div>
    <div class="card" style="margin-top:8px"><div id="planbox">${unitPlanSVG(e, { parts: [part] })}</div>
      <div class="f" style="margin-top:6px"><label>Which quarter of ${esc(of)}?</label><div class="btns">${Object.keys(Q).map(k => `<button class="btn sm ${k === S.winQ ? '' : 'sec'}" data-q="${k}">${k}</button>`).join('')}</div>
      <div class="help">${fmtM(w)} × ${fmtM(h)} m</div></div></div>
    ${closedPar ? '' : `<div class="check">Level ${esc(last.data.levelno)} becomes the last level of ${esc(of)} (the window carries on below it).</div>`}
    <div class="formbar"><button class="btn" id="wgo">Create window ${esc(L)} &amp; start level ${(num(last.data.levelno) || 0) + 1}</button><a class="btn sec" href="#/rec/${id}">Cancel</a></div>`;
  $('#app').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { S.winQ = b.dataset.q; viewWindow(id, of); });
  $('#wgo').onclick = async () => {
    if (!closedPar) { last.data = { ...last.data, terminal_level: 1, close_override: last.data.close_override || `Continued below in ¼-unit window ${L}` }; await save(last); }
    const su = mk('subunits', id, {});
    su.data = { letter: L, window_of: of, parts: [part], opened: today(), reason: `¼-unit window in ${of} to reach sterile`, area_m2: partsArea([part]), size_label: `${sizeLabel([part])} window`, _status: 'complete', _missing: [] };
    await save(su); toast(`Window ${L} created`);
    location.hash = `#/new/levels/${id}?su=${encodeURIComponent(L)}`;
  };
}

/* slide a piece along the outside edge of the existing subunits: nearest edge-touching, non-overlapping spot to the target */
function edgeSpots(a, fixed) {
  const cands = [], st = 0.25, eps = 1e-6;
  for (const b of fixed) {
    for (let x = r2(b.x - a.w + st); x <= b.x + b.w - st + eps; x = r2(x + st)) { cands.push({ x, y: r2(b.y + b.h) }, { x, y: r2(b.y - a.h) }); }
    for (let y = r2(b.y - a.h + st); y <= b.y + b.h - st + eps; y = r2(y + st)) { cands.push({ x: r2(b.x + b.w), y }, { x: r2(b.x - a.w), y }); }
  }
  const seen = new Set();
  return cands.filter(c => { const k = c.x + ',' + c.y; if (seen.has(k)) return false; seen.add(k); return !fixed.some(b => overlap({ ...a, ...c }, b)); });
}
/* one step around the unit's edge in the direction pressed (also turns corners) */
function stepPiece(a, fixed, dx, dy) {
  let best = null, bc = Infinity;
  for (const c of edgeSpots(a, fixed)) {
    const mx = c.x - a.x, my = c.y - a.y, along = mx * dx + my * dy; if (along <= 1e-6) continue;
    const perp = Math.abs(mx * dy - my * dx), cost = Math.hypot(mx, my) + 2 * perp;
    if (cost < bc - 1e-9) { bc = cost; best = c; }
  }
  if (best) { a.x = best.x; a.y = best.y; }
  return !!best;
}
function snapPiece(a, fixed, target) {
  const cands = [], st = 0.25, eps = 1e-6;
  for (const b of fixed) {
    for (let x = r2(b.x - a.w + st); x <= b.x + b.w - st + eps; x = r2(x + st)) { cands.push({ x, y: r2(b.y + b.h) }, { x, y: r2(b.y - a.h) }); }
    for (let y = r2(b.y - a.h + st); y <= b.y + b.h - st + eps; y = r2(y + st)) { cands.push({ x: r2(b.x + b.w), y }, { x: r2(b.x - a.w), y }); }
  }
  let best = null, bd = Infinity;
  for (const c of cands) {
    const q = { ...a, ...c };
    if (fixed.some(b => overlap(q, b))) continue;
    const dd = Math.hypot(c.x - target.x, c.y - target.y);
    if (dd < bd - eps) { bd = dd; best = c; }
  }
  if (best) { a.x = best.x; a.y = best.y; }

}
function setDatum(a, c) { a.x = c === 'SW' || c === 'NW' ? 0 : -a.w; a.y = c === 'SW' || c === 'SE' ? 0 : -a.h; }

/* ================= labels, scanning, custody ================= */
const CODE_ALPHA = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // no I, L, O, U
function parseCode(t) {
  t = String(t || ''); const i = t.indexOf('#/scan/'); if (i >= 0) t = t.slice(i + 7);
  const m = t.toUpperCase().match(/\b([BXN])-?([0-9A-HJKMNP-TV-Z]{6})\b/); // N- = bag recorded without a QR label
  return m ? `${m[1]}-${m[2]}` : null;
}
function newCode(kind) { const b = crypto.getRandomValues(new Uint8Array(6)); return kind + '-' + [...b].map(x => CODE_ALPHA[x % 32]).join(''); }
function nextTemp(district, kind) {
  const [abbr, dig] = DISTRICT_CODE[district] || ['OTH', 9], L = kind === 'Survey area' ? 'S' : 'T';
  const re = new RegExp('^' + abbr + '-' + L + '(\\d+)$');
  const n = live('sites').reduce((m, r) => { const a = (r.data.temp_name || r.data.sitename || '').match(re); return a ? Math.max(m, +a[1]) : m; }, 0) + 1;
  return { name: `${abbr}-${L}${pad(n, 2)}`, code: (L === 'S' ? '90' : '80') + dig + pad(n % 1000, 3) };
}

  const r = mk('custody', null, { item_qr: code, item_kind: kind, action, to_person: me(), from_person: '', location: '', time: now(), ...extra, _status: 'complete', _missing: [] });
  await save(r); return r;
}

  const b = mk('bags', level.id, {});
  b.data = { qr: code, bag_no: nextNum(live('bags').filter(r => r.site === level.site), 'bag_no'), contents: contents || 'Prehistoric artifacts', date: today(), _status: 'complete', _missing: [] };
  await save(b);

let scanStream = null;
function openScanner(title = 'Scan label') {
  return new Promise(resolve => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="card" style="max-width:520px"><b>${esc(title)}</b>
      <div class="scanbox" style="margin:10px 0"><video playsinline muted></video><div class="aim"></div></div>
      <div class="help sm" id="smsg">Point the camera at the QR code.</div>
      <div class="qrrow" style="margin-top:8px"><input id="sman" placeholder="…or type / use a USB scanner" autocapitalize="characters" autocomplete="off"><button class="btn sm" id="sok">OK</button></div>
      <div class="btns" style="justify-content:flex-end"><button class="btn sec" id="sx">Cancel</button></div></div>`;
    document.body.append(m);
    const video = $('video', m), msg = $('#smsg', m), man = $('#sman', m);
    let stop = false; const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
    const done = v => { if (stop) return; stop = true; scanStream?.getTracks().forEach(t => t.stop()); scanStream = null; m.remove(); resolve(v); };
    $('#sx', m).onclick = () => done(null);
    const manual = () => { const v = man.value.trim(); if (!v) return; const c = parseCode(v); if (!c) { msg.textContent = `“${v}” is not a KNF label code (B-XXXXXX or X-XXXXXX).`; return; } done(c); };
    $('#sok', m).onclick = manual; man.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); manual(); } };
    if (!('ontouchstart' in window)) man.focus();
    let det = null;
    (async () => {
      try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { }
      try {
        scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
        if (stop) { scanStream.getTracks().forEach(t => t.stop()); return; }
        video.srcObject = scanStream; await video.play();
      } catch (e) { msg.textContent = 'Camera not available here: type the code or use a USB scanner.'; return; }
      const loop = async () => {
        if (stop) return;
        if (video.readyState >= 2 && video.videoWidth) {
          let txt = null;
          try {
            if (det) { const r = await det.detect(video); if (r[0]) txt = r[0].rawValue; }
            else {
              const w = Math.min(720, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
              cv.width = w; cv.height = h; cx.drawImage(video, 0, 0, w, h);
              const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' }); if (r) txt = r.data;
            }
          } catch (e) { }
          if (txt) { const c = parseCode(txt); if (c) { return done(c); } msg.textContent = 'That QR code is not a KNF label.'; }
        }
        setTimeout(loop, 120);
      };
      loop();
    })();
  });
}

/* ================= Survey plans: transects of planned (undug) STPs =================

const isSurvey = s => s?.data.record_kind === 'Survey area';
function surveyStats(siteId) {
  const ex = kids(siteId, 'excavations').filter(e => e.data.excavation_type === 'STP');
  const planned = ex.filter(e => e.data.planned), notdug = ex.filter(e => !e.data.planned && e.data.not_excavated_reason && !kids(e.id, 'levels').length);
  const dug = ex.filter(e => !e.data.planned && !notdug.includes(e));

}

  for (const r of rows) {
    const x = mk('excavations', site.id, {});
    x.data = { excavation_type: 'STP', seq, excavation_name: `T${r.transect} STP ${r.stp}`, transect: String(r.transect), planned: 1, target_e: +(+r.e).toFixed(2), target_n: +(+r.n).toFixed(2), target_zone: r.zone || 15, lengthcm: 30, widthcm: 30, number_of_eu: 1, _status: 'planned', _missing: [] };
    x.data = compute('excavations', x.data, { site, self: x }); x.data._status = 'planned';
    await save(x); seq++; made++;

}
function planTransectsModal(site) {
  return new Promise(resolve => {

    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="card" style="max-width:520px"><b class="t">Plan transects</b>
      <div class="help">Lays out parallel transects of planned STPs from a start point. The first transect starts at the start point and runs along the bearing; the next ones are offset to the side you pick.</div>
      <div class="grid" style="margin-top:8px">
        <div class="f"><label>Start UTM E</label><input id="pe" inputmode="decimal"></div><div class="f"><label>Start UTM N</label><input id="pn" inputmode="decimal"></div>
        <div class="f"><label>&nbsp;</label><button type="button" class="btn sec sm" id="pme">📍 Use my position</button></div>
        <div class="f"><label>Transect bearing (° grid)</label><input id="pb" inputmode="decimal" value="0"></div>
        <div class="f"><label>Next transects to the</label><select id="ps"><option value="1">right (clockwise)</option><option value="-1">left</option></select></div>

        <div class="f"><label>Transect spacing (m)</label><input id="pts" inputmode="decimal" value="30"></div>

function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim()), sep = lines[0].includes('\t') ? '\t' : lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',';

}
async function importPlanned(site, file) {
  const rows = parseCSV(await file.text()); if (!rows.length) return toast('Empty file');
  const h = rows[0].map(c => c.toLowerCase()), has = h.some(c => /[a-z]/.test(c));
  const col = (...names) => h.findIndex(c => names.some(n => c === n || c.startsWith(n)));
  const ci = has ? { t: col('transect', 'tran', 't'), s: col('stp', 'shovel', 'name', 'no', 'num', 'id'), e: col('easting', 'utme', 'east', 'e', 'x'), n: col('northing', 'utmn', 'north', 'n', 'y') } : { t: 0, s: 1, e: 2, n: 3 };
  if (ci.e < 0 || ci.n < 0) return toast('Could not find easting/northing columns (UTM 15N)');
  const out = [];
  rows.slice(has ? 1 : 0).forEach((r, i) => { const e = num(r[ci.e]), n = num(r[ci.n]); if (e == null || n == null) return; out.push({ transect: ci.t >= 0 ? r[ci.t] || '?' : '1', stp: ci.s >= 0 ? String(r[ci.s]).replace(/^.*?(\d+)$/, '$1') : i + 1, e, n }); });
  if (!out.length) return toast('No rows with coordinates');
  if (out.some(r => r.e < 100000 || r.n < 1000000) && !(await ask('Some coordinates do not look like UTM 15N metres (easting ~400000–800000, northing ~3300000–3700000). Import anyway?', 'Import'))) return;
  if (!(await ask(`Import ${out.length} planned STPs into ${site.data.sitename}?`, 'Import'))) return;
  const n = await addPlanned(site, out); toast(`${n} planned STPs added`); render();
}
const bearingName = deg => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];

/* ================= Survey: more than 5 artifacts in one STP = new site =================
   Applies to STPs in survey areas, isolated finds and other work (not inside a recorded or new site). */
const NEW_SITE_MIN = 6;
function stpCount(exc) { return kids(exc.id, 'levels').reduce((a, l) => a + (l.data.artifacts ? num(l.data.field_count) || 0 : 0), 0); }
function newSiteDue(exc) {

function delinTargets(d) {

/* ================= End-of-day bag check =================
   The field director scans the box, then every bag going into it. The app compares that with the bags
   it expects (every bag at the chosen sites that is not yet in a box or at the lab) and reports missing
   bags (with who collected them) and extra labels. Each scan is also a custody event (Placed in box). */
const LAB_ACTIONS = ['Received at lab', 'Checked out for analysis', 'Returned to storage', 'Sent to specialist', 'Curated'];
function bagInfo(b) {
  const lv = get(b.parent), ex = lv && get(lv.parent), site = get(b.site);
  return {
    code: b.data.qr, site: site?.data.sitename || '?', exc: ex ? (ex.data.excavation_name || ex.data.excavationid || '') : '',
    level: lv ? `EU ${lv.data.excavation_unit || 'A'} L${lv.data.levelno ?? '?'}` : '', depth: lv ? `${lv.data.top_cm ?? '?'}–${lv.data.bgscm ?? '?'} cm` : '',
    contents: b.data.contents || '', date: b.data.date || (b.created_at || '').slice(0, 10), by: b.created_by || '?', crew: ex?.data.crew || '',
  };
}
const bagWhere = i => `${i.site} · ${i.exc} · ${i.level}${i.depth ? ' (' + i.depth + ')' : ''}`;
function outstanding(b) { const st = itemState(b.data.qr); return !st.box && !LAB_ACTIONS.includes(st.last?.data.action); }
function dcExpected(dc) {
  const set = new Set(dc.expected);
  live('bags').forEach(b => { if (dc.sites.includes(b.site) && outstanding(b)) set.add(b.data.qr); });
  return [...set];
}
function dcClassify(dc, code) {
  const b = live('bags').find(x => x.data.qr === code);
  if (!b) return { ok: false, why: 'Label not linked to any level on this device: its level may not have synced yet, or the label was never scanned at Finish' };
  if (!dc.sites.includes(b.site)) return { ok: false, why: `Bag from another site (${bagWhere(bagInfo(b))})`, b };
  return { ok: true, b };
}
function dcSummary(dc) {
  const exp = dcExpected(dc), got = new Set(dc.scanned.map(s => s.code));
  const missing = exp.filter(c => !got.has(c)).map(c => bagInfo(live('bags').find(b => b.data.qr === c)));
  const extras = dc.scanned.map(s => ({ ...s, ...dcClassify(dc, s.code) })).filter(s => !s.ok).map(s => ({ code: s.code, box: s.box, why: s.why }));
  return { exp, missing, extras, okN: dc.scanned.length - extras.length };
}
const saveDC = () => CORE.setMeta('daycheck', S.dc || null);
function groupBy(list, k) { const g = {}; list.forEach(x => (g[x[k]] ||= []).push(x)); return g; }
async function dcScanBox() {
  const bx = await openScanner('Scan the BOX label the bags go into'); if (!bx) return false;
  if (!bx.startsWith('X-')) { toast('That is a bag label. Scan the box label (X-…) first'); return false; }
  return dcSetBox(bx);
}
async function dcSetBox(bx) {
  if (!live('boxes').find(r => r.data.qr === bx)) {
    const r = mk('boxes', null, { qr: bx, box_no: String(nextNum(live('boxes'), 'box_no')), box_kind: 'Field box', location: 'Field (end-of-day check)', _status: 'complete', _missing: [] });
    await save(r); await custodyEvent(bx, 'box', 'Transferred', { location: r.data.location, notes: 'Box registered at end-of-day check' });
    toast(`New box registered: ${bx}`);
  }
  S.dc.box = bx; if (!S.dc.boxes.includes(bx)) S.dc.boxes.push(bx); await saveDC(); return true;
}
async function dcScanBags() {
  if (!S.dc.box && !(await dcScanBox())) return;
  for (;;) {
    const s = dcSummary(S.dc);
    const code = await openScanner(`Box ${S.dc.box} · ${s.okN} of ${s.exp.length} bags scanned · Cancel when done`); if (!code) break;
    if (code.startsWith('X-')) { await dcSetBox(code); scanFeedback('ok'); toast(`Now filling box ${code}`); continue; }
    if (S.dc.scanned.some(x => x.code === code)) { scanFeedback('bad'); toast(`${code} was already scanned`); continue; }
    const c = dcClassify(S.dc, code), st = itemState(code);
    await custodyEvent(code, 'bag', 'Placed in box', { from_person: st.holder, box_qr: S.dc.box, location: 'Box ' + S.dc.box, notes: 'End-of-day bag check' });
    S.dc.scanned.push({ code, box: S.dc.box, time: now() }); await saveDC();
    scanFeedback(c.ok ? 'ok' : 'bad');
    toast(c.ok ? `✓ ${code} · ${bagWhere(bagInfo(c.b))}` : `⚠ EXTRA ${code}: ${c.b ? 'from another site' : 'not linked to a level'}`);
  }
  viewDayCheck();
}
function missingHTML(missing, canMark) {

  return Object.entries(groupBy(missing, 'by')).map(([who, l]) => `<div class="card dcgroup"><b>${esc(who)}</b> · ${l.length} bag${l.length > 1 ? 's' : ''}
    <ul>${l.map(i => `<li><b>${esc(i.code)}</b> · ${esc(bagWhere(i))} · ${esc(i.contents)} · bagged ${esc(i.date)}${i.crew ? ` <span class="help">(crew: ${esc(i.crew)})</span>` : ''}${canMark ? ` <button class="btn sm sec" data-found="${esc(i.code)}">✓ It’s here (label missing / unreadable)</button>` : ''}</li>`).join('')}</ul></div>`).join('')
    + (canMark ? '<div class="help">Found a bag whose QR fell off or won’t scan? Match the writing on the bag to the list and tap “It’s here”. Then attach a new label from the bag’s page.</div>' : '');
}
function extrasHTML(extras) {
  if (!extras.length) return '<div class="check okc">No extra labels ✓</div>';
  return `<ul class="card dcgroup">${extras.map(x => `<li><b>${esc(x.code)}</b> (box ${esc(x.box)}): ${esc(x.why)}</li>`).join('')}</ul>`;

    if (!b) { b = mk('boxes', null, { qr: c, box_no: c.slice(2), box_kind: 'Final storage (curation)', location: S.lastStoreLoc || '', packed_by: me(), packed_date: today(), _status: 'complete', _missing: [] }); await save(b); }
    S.stBox = c; viewStorage();
  };
  if (!box) return;
  const keep = async (k, v) => { box.data = { ...box.data, [k]: v }; await save(box); if (k === 'location') { S.lastStoreLoc = v; await custodyEvent(code, 'box', 'Returned to storage', { location: v, notes: 'Final storage location' }); } };
  $('#stloc').onchange = () => keep('location', $('#stloc').value.trim());
  $('#stdesc').onchange = () => keep('contents_desc', $('#stdesc').value.trim());
  $('#stdone').onclick = () => { S.stBox = null; viewStorage(); };
  $('#stscan').onclick = async () => {
    for (let n = 0; ; n++) {
      const c = await openScanner(`Box ${box.data.box_no}: scan bag ${n + 1} (Cancel when done)`); if (!c) break;
      if (c.startsWith('X-')) { scanFeedback('bad'); toast('That is a box label. Scan the bags'); continue; }
      const bg = live('bags').find(r => r.data.qr === c);
      if (!bg) { scanFeedback('bad'); toast(`${c} is not linked to a level yet`); continue; }
      if (itemState(c).box === code) { scanFeedback('bad'); toast(`${c} is already in this box`); continue; }
      await custodyEvent(c, 'bag', 'Placed in box', { from_person: itemState(c).holder, box_qr: code, location: `Box ${box.data.box_no} (final storage)`, notes: 'Final storage' });
      scanFeedback('ok'); toast(`✓ ${c} → ${box.data.box_no}`);
    }
    viewStorage();
  };
}

const LAYOUTS = {
  '5160': { name: 'Avery 5160 / 8160 / weatherproof equiv. (30 per sheet, 2⅝ × 1 in)', cols: 3, rows: 10, w: 2.625, h: 1, top: 0.5, left: 0.1875, gx: 0.125, gy: 0, qr: 0.86 },
  '5163': { name: 'Avery 5163 / 8163 (10 per sheet, 4 × 2 in), good for boxes', cols: 2, rows: 5, w: 4, h: 2, top: 0.5, left: 0.156, gx: 0.1875, gy: 0, qr: 1.75 },
  'grid': { name: 'Plain paper grid (24 per sheet, cut by hand)', cols: 4, rows: 6, w: 2, h: 1.75, top: 0.25, left: 0.25, gx: 0, gy: 0, qr: 1.15 },
};
function viewLabels(qs) {
  setTitle('Print labels');
  const L = S.lbl ||= { kind: qs === 'X' ? 'X' : 'B', layout: qs === 'X' ? '5163' : '5160', sheets: 1, codes: [] };
  const lay = LAYOUTS[L.layout];
  const sheetHTML = codes => {
    const per = lay.cols * lay.rows, pages = [];
    for (let p = 0; p < codes.length; p += per) {
      pages.push(`<div class="sheet">${codes.slice(p, p + per).map((c, i) => {
        const col = i % lay.cols, row = Math.floor(i / lay.cols);
        const x = lay.left + col * (lay.w + lay.gx), y = lay.top + row * (lay.h + lay.gy);
        return `<div class="lbl" style="left:${x}in;top:${y}in;width:${lay.w}in;height:${lay.h}in">${qrSVG(labelText(c), lay.qr + 'in')}
          <div class="lt"><div class="lc">${c}</div><div class="ls">${c[0] === 'B' ? 'KNF · Site ______<br>Unit ____ Lvl ____<br>Date ______' : 'KNF BOX · No. ______<br>Project ____________'}</div></div></div>`;
      }).join('')}</div>`);
    }
    return pages.join('');
  };
  $('#app').innerHTML = `<div class="noprint"><h2>Print labels</h2>
    <div class="card grid">
      <div class="f"><label>Labels for</label><select id="lk"><option value="B" ${L.kind === 'B' ? 'selected' : ''}>Bags (B-)</option><option value="X" ${L.kind === 'X' ? 'selected' : ''}>Boxes (X-)</option></select></div>
      <div class="f w2"><label>Label sheet</label><select id="ll">${Object.entries(LAYOUTS).map(([k, v]) => `<option value="${k}" ${k === L.layout ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></div>
      <div class="f"><label>Sheets</label><input id="ln" inputmode="numeric" value="${L.sheets}"></div>
      <div class="f w3"><div class="btns"><button class="btn" id="lgen">Make new labels</button>${L.codes.length ? `<button class="btn sec" id="lprint">⎙ Print</button>` : ''}</div></div>
    </div>
    <div class="help">Every label gets a random code that can't repeat, so several people can print labels without coordinating. Print at 100% / “Actual size”. Use weatherproof labels for field bags.${appBase() ? '' : ' <b>Print from the installed/hosted app so phone cameras can open the label directly.</b>'}</div>
    ${L.codes.length ? `<h3>${L.codes.length} labels</h3>` : ''}</div>
    <div class="sheetwrap">${L.codes.length ? sheetHTML(L.codes) : ''}</div>`;
  $('#lk').onchange = e => { L.kind = e.target.value; L.layout = L.kind === 'X' ? '5163' : '5160'; L.codes = []; viewLabels(); };
  $('#ll').onchange = e => { L.layout = e.target.value; L.codes = []; viewLabels(); };
  $('#lgen').onclick = () => { L.sheets = Math.max(1, Math.min(20, +$('#ln').value || 1)); const lay2 = LAYOUTS[L.layout]; L.codes = Array.from({ length: L.sheets * lay2.cols * lay2.rows }, () => newCode(L.kind)); viewLabels(); };
  $('#lprint') && ($('#lprint').onclick = () => window.print());
}

/* ================= export / import ================= */
function csvCell(v) { if (v == null) return ''; const s = typeof v === 'object' ? JSON.stringify(v) : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function provenience(r) {
  const out = {}; let p = r.parent ? get(r.parent) : null;
  while (p) {
    if (p.tbl === 'levels') { out.level_uuid = p.id; out.levelid = p.data.levelid; out.excavation_unit = p.data.excavation_unit; out.levelno = p.data.levelno; out.top_cm = p.data.top_cm; out.bottom_cm = p.data.bgscm; }
    if (p.tbl === 'excavations') { out.excavation_uuid = p.id; out.excavationid = p.data.excavationid; out.excavation_name = p.data.excavation_name; }
    p = p.parent ? get(p.parent) : null;
  }
  const s = get(r.site); out.sitename = s?.data.sitename;
  return out;
}
function tableCSV(t) {
  const def = TABLES[t], recs = live(t);
  const extra = (t === 'excavations' || t === 'mappoints') ? ['lat', 'lon', 'utmzone', 'utme', 'utmn', 'gps_acc_m', 'gps_n', 'gps_time', 'gps_source', 'gps_entry', 'datum', 'elev_m'] : [];
  const fk = def.fields.filter(f => f.t !== 'gps').map(f => f.k);
  const provK = { sites: [], excavations: ['sitename'], levels: ['sitename', 'excavation_uuid', 'excavationid', 'excavation_name'] }[t]
    || ['sitename', 'excavation_uuid', 'excavationid', 'excavation_name', 'level_uuid', 'levelid', 'excavation_unit', 'levelno', 'top_cm', 'bottom_cm'];
  const head = ['uuid', 'parent_uuid', ...provK, ...[...new Set([...fk, ...extra])].filter(k => !provK.includes(k)), 'record_status', 'missing_items', 'created_by', 'created_at', 'updated_by', 'updated_at'];
  const lines = [head.join(',')];
  for (const r of recs) {
    const pv = provenience(r), row = { uuid: r.id, parent_uuid: r.parent, ...pv, ...r.data, record_status: r.data._status || '', missing_items: (r.data._missing || []).join('; '), created_by: r.created_by, created_at: r.created_at, updated_by: r.updated_by, updated_at: r.updated_at };
    lines.push(head.map(k => csvCell(row[k])).join(','));
  }
  return '﻿' + lines.join('\r\n');
}
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = t[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }; })();
function zip(files) { // store-only zip
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)), dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate());
  for (const [name, text] of files) {
    const nb = enc.encode(name), data = enc.encode(text), crc = CRC(data);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(10, dt, true); h.setUint16(12, dd, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true);
    parts.push(h.buffer, nb, data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(12, dt, true); c.setUint16(14, dd, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true); c.setUint32(42, off, true);
    central.push(c.buffer, nb); off += 30 + nb.length + data.length;
  }
  const csize = central.reduce((a, b) => a + b.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, e.buffer], { type: 'application/zip' });
}
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, '');
function exportCSV() {
  const files = Object.keys(TABLES).filter(t => live(t).length).map(t => [`${t}.csv`, tableCSV(t)]);
  if (!files.length) return toast('Nothing to export yet');
  download(zip(files), `knf_field_data_${stamp()}.zip`);
}
function exportJSON() { download(new Blob([JSON.stringify({ app: 'knf-field-data', exported: now(), by: me(), records: [...S.recs.values()] })], { type: 'application/json' }), `knf_backup_${stamp()}.json`); }
async function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (!Array.isArray(j.records)) throw new Error('Not a KNF backup file');
    let n = 0; const put = [];
    for (const r of j.records) { const l = S.recs.get(r.id); if (!l || (r.updated_at > l.updated_at)) { put.push({ ...r, dirty: 1 }); n++; } }
    if (!(await ask(`Merge ${n} new or newer records from this backup? Existing newer records are kept.`, 'Merge'))) return;
    await CORE.putMany(put); await reload(); updatePill(); queueSync(500); toast(`Merged ${n} records`); render();
  } catch (err) { toast('Import failed: ' + err.message); }
}

/* ================= router ================= */
function render() {
  const h = location.hash || '#/';
  const [path, qs] = h.slice(1).split('?');
  const seg = path.split('/').filter(Boolean);
  const tab = { sites: 'field', site: 'field', rec: 'field', closed: 'field', closeout: 'field', window: 'field', edit: 'field', new: 'field', lab: 'lab', catalog: 'lab', storage: 'lab', boxlabel: 'custody', c14: 'lab', scan: 'custody', boxes: 'custody', labels: 'custody', daycheck: 'custody', custody: 'custody', move: 'custody', data: 'data' }[seg[0]] || (seg.length ? '' : 'home');
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; document.querySelectorAll('.modal').forEach(m => m.remove()); }
  stopLiveGps(); scrollTo(0, 0);
  if (needsSetup() && seg[0] !== 'setup') return viewSetup();
  if (!seg.length) return viewHome();
  switch (seg[0]) {
    case 'sites': return viewSites();
    case 'site': return viewSite(seg[1]);
    case 'rec': return viewRec(seg[1]);
    case 'closeout': return viewUnitCloseout(seg[1]);
    case 'storage': return viewStorage();
    case 'c14': { const r = get(seg[1]); return r ? formView(r, false, { lab: true, back: r.data.level_id ? '#/rec/' + r.data.level_id : null }) : notFound(); }
    case 'boxlabel': return viewBoxLabel(decodeURIComponent(seg[1] || ''));
    case 'window': return viewWindow(seg[1], new URLSearchParams(qs || '').get('of')?.toUpperCase() || '');
    case 'closed': return viewClosed(seg[1], new URLSearchParams(qs || '').get('su')?.toUpperCase() || null);
    case 'edit': { const r = get(seg[1]); return !r ? notFound() : r.tbl === 'subunits' ? subunitEditor(r, false) : formView(r, false); }
    case 'new': {
      const t = seg[1], parent = seg[2] || null;
      if (!TABLES[t]) return notFound();
      if (TABLES[t].single) { const ex = kids(parent, t)[0]; if (ex) return formView(ex, false); }
      if (t === 'levels') {
        const open = kids(parent, 'levels').filter(l => l.data._status === 'draft');
        if (open.length) {
          const l = open[0];
          $('#app').innerHTML = `${crumbs(get(parent))}<div class="unfinbox"><b class="t">⚠ Finish the previous level first</b>EU ${esc(l.data.excavation_unit)} Level ${esc(l.data.levelno)} is UNFINISHED and has not been sent to the project. Missing: ${esc(completeness(l, l.data).join('; '))}.
            <div class="btns"><a class="btn" href="#/rec/${l.id}">Go to that level</a></div></div>`;
          return;
        }
      }
      if (qs && t === 'excavations') S._newType = { STP: 'STP', TP: 'TP' }[qs] || null;
      const lv = qs && qs.startsWith('lv=') ? get(qs.slice(3)) : null;
      if (t === 'subunits') { const r0 = S._suNew && S._suNew.parent === parent ? S._suNew : (S._suNew = mk('subunits', parent, {})); return subunitEditor(r0, true); }
      S._newSU = qs && qs.startsWith('su=') ? decodeURIComponent(qs.slice(3)) : null;
      const rec = mk(t, parent, {});
      rec.data = defaults(t, lv ? lv.id : parent);
      S._newType = null; S._newSU = null;
      if (t === 'mappoints') {
        const p0 = get(parent), sibs = kids(parent, 'mappoints').sort((a, b) => a.created_at > b.created_at ? 1 : -1), last = sibs[sibs.length - 1];
        rec.data.kind = qs === 'corner' ? 'Unit corner' : (last && p0?.tbl === 'sites' ? last.data.kind : (p0?.tbl === 'sites' ? 'Boundary' : 'Other'));
        if (last && last.data.kind === rec.data.kind && last.data.label) { const m = String(last.data.label).match(/^(.*?)(\d+)$/); rec.data.label = m ? m[1] + (+m[2] + 1) : ''; }
        else if (rec.data.kind === 'Boundary') rec.data.label = 'B1';
      }
      if (t === 'levels' && qs && qs.startsWith('bag=')) rec.data.bag_qr = parseCode(qs.slice(4));
      if (t === 'boxes') { rec.data.qr = qs && qs.startsWith('qr=') ? parseCode(qs.slice(3)) : ''; rec.data.box_no = nextNum(live('boxes'), 'box_no'); }
      if (t === 'sites') { rec.data.record_kind = qs === 'temp' ? 'New site (temporary no.)' : qs === 'survey' ? 'Survey area' : 'Previously recorded site'; rec.data.project = 'KNF Phase II 2026-27'; rec.data.usgsquad = 'Unknown (find later)'; }
      return formView(rec, true);
    }
    case 'drafts': return viewDrafts();
    case 'daycheck': return viewDayCheck();
    case 'custody': return viewCustody();
    case 'move': return viewMove();
    case 'parishes': return viewParishKey();
    case 'offline': return viewOffline();
    case 'setup': return viewSetup();
    case 'people': return viewPeople();
    case 'testplan': return viewTestPlan();
    case 'lab': return viewLab();
    case 'catalog': return viewCatalog(seg[1]);
    case 'scan': return viewScan(seg[1] ? decodeURIComponent(seg[1]) : null);
    case 'boxes': return viewBoxes();
    case 'labels': return viewLabels(qs);
    case 'data': return viewData();
    case 'settings': return viewSettings();
  }
  notFound();
}
function applyTheme() { const t = S.settings.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
let guardHash = location.hash;
addEventListener('hashchange', async () => {
  if (S.formDirty && !S.guarding) {
    const to = location.hash;
    S.guarding = true; history.replaceState(null, '', guardHash);
    const leave = await ask('You have typed changes on this form that are NOT saved. Leave anyway and lose them?', 'Leave without saving', 'Stay');
    S.guarding = false;
    if (!leave) return;
    S.formDirty = false; location.hash = to; return;
  }
  if (S.guarding) return;
  guardHash = location.hash; render(); updateDraftBar();
});
$('#hdr').addEventListener('click', e => { if (e.target.closest('button,a,input,select')) return; if (location.hash !== '#/' && location.hash !== '') location.hash = '#/'; });
addEventListener('beforeunload', e => { if (S.formDirty || draftCount()) { e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  S.settings = { ...DEF, ...((await CORE.getMeta('settings')) || {}) };
  S.session = await CORE.getMeta('session');
  S.lastSync = await CORE.getMeta('last_sync');
  await reload(); applyTheme(); updatePill(); await loadRegistry(false); await migrateCodes();
  if (TESTMODE) { $('#testbar').classList.remove('hidden'); }
  render();
  try { if (navigator.storage?.persist) S.persisted = await navigator.storage.persist(); } catch (e) { }
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(async reg => {
      try { if ('periodicSync' in reg) await reg.periodicSync.register('upload', { minInterval: 15 * 60 * 1000 }); } catch (e) { }
    }).catch(() => { });
    navigator.serviceWorker.addEventListener('message', async e => { if (e.data?.type === 'synced') { await reload(); updatePill(); } });
  }
  if (draftCount()) setTimeout(async () => { if (await ask(`⚠ ${draftCount()} UNFINISHED record(s) on this device are NOT sent to the project. Finish them now?`, 'Show me', 'Later')) location.hash = '#/drafts'; }, 600);
  runSync();
})();
